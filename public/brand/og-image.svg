<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#1a0f2e"/>
      <stop offset="55%" stop-color="#120a22"/>
      <stop offset="100%" stop-color="#0b0613"/>
    </radialGradient>
    <radialGradient id="glow1" cx="85%" cy="0%" r="50%">
      <stop offset="0%" stop-color="#ec1170" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ec1170" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7b3fc4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7b3fc4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5e9d"/>
      <stop offset="100%" stop-color="#ec1170"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec1170" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec1170" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="600" cy="270" r="130"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="144" cy="108" r="1.4" opacity="0.75"/>
    <circle cx="864" cy="144" r="1.1" opacity="0.6"/>
    <circle cx="456" cy="744" r="1.6" opacity="0.5"/>
    <circle cx="1032" cy="576" r="1.2" opacity="0.65"/>
    <circle cx="264" cy="1008" r="1.4" opacity="0.45"/>
    <circle cx="720" cy="1080" r="1.7" opacity="0.55"/>
    <circle cx="180" cy="216" r="1" opacity="0.5"/>
    <circle cx="1020" cy="280" r="1.3" opacity="0.7"/>
    <circle cx="340" cy="540" r="1.1" opacity="0.4"/>
    <circle cx="980" cy="420" r="1" opacity="0.55"/>
    <circle cx="80" cy="380" r="1.2" opacity="0.5"/>
    <circle cx="1120" cy="540" r="1.4" opacity="0.45"/>
  </g>

  <!-- Avatar circle glow -->
  <circle cx="600" cy="270" r="200" fill="url(#avatarGlow)"/>
  <!-- Avatar circle (Dante placeholder - filled with gradient) -->
  <circle cx="600" cy="270" r="130" fill="url(#accent)"/>
  <circle cx="600" cy="270" r="130" fill="none" stroke="#ff5e9d" stroke-width="4" opacity="0.8"/>

  <!-- Logo text (top) -->
  <text x="600" y="480" text-anchor="middle" font-family="DejaVu Serif" font-size="72" font-weight="600" fill="#f5f0fa">Dante <tspan fill="url(#accent)">Clube</tspan></text>

  <!-- Tagline -->
  <text x="600" y="540" text-anchor="middle" font-family="DejaVu Sans" font-size="28" fill="#b8a8d0">O clube de benefícios do Universo Querido Dante</text>

  <!-- Badge -->
  <rect x="540" y="380" width="120" height="36" rx="18" fill="#2ecc71" opacity="0.95"/>
  <text x="600" y="404" text-anchor="middle" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#0b0613">100% Gratuito</text>
</svg>
